<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Indeed Recent Jobs (Frontend Only)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:#0f172a; color:#e5e7eb; font-family:sans-serif; margin:0; padding:20px; }
    input, button { padding:10px; border-radius:6px; border:1px solid #334155; background:#1e293b; color:#e5e7eb; }
    button { background:#2563eb; cursor:pointer; }
    .job { background:#1e293b; padding:15px; margin:10px 0; border-radius:8px; }
    a { color:#60a5fa; }
  </style>
</head>
<body>

<h2>Indeed Recent Jobs (Frontend Only)</h2>

<input id="query" placeholder="Job title (e.g. frontend developer)">
<input id="location" placeholder="Location (e.g. Calgary)">
<button onclick="fetchJobs()">Search</button>

<div id="status"></div>
<div id="results"></div>

<script>
async function fetchJobs() {
  const q = document.getElementById("query").value;
  const loc = document.getElementById("location").value;

  document.getElementById("status").innerText = "Loading...";
  document.getElementById("results").innerHTML = "";

  const url = `https://serpapi.com/search.json?engine=google_jobs&q=${encodeURIComponent(q + " " + loc)}&api_key=YOUR_SERPAPI_KEY`;

  const res = await fetch(url);
  const data = await res.json();

  const jobs = data.jobs_results || [];

  document.getElementById("status").innerText = `Found ${jobs.length} jobs`;

  jobs.forEach(job => {
    const div = document.createElement("div");
    div.className = "job";

    div.innerHTML = `
      <h3>${job.title}</h3>
      <p>${job.company_name || ""} — ${job.location || ""}</p>
      <p>${job.detected_extensions?.posted_at || ""}</p>
      <a href="${job.apply_options?.[0]?.link || job.apply_link}" target="_blank">View Job</a>
    `;

    document.getElementById("results").appendChild(div);
  });
}
</script>

</body>
</html>
